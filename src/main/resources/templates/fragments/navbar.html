<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <style th:fragment="navbar-styles">
        .top-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0 1.5rem;
            background: #2f3b52;
        }

        .menu-item {
            display: inline-block;
            padding: 1rem 0.75rem;
            color: #fff;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .menu-item:hover,
        .menu-item:focus-visible {
            background: #465a7b;
        }
    </style>
</head>
<body>
<nav class="top-bar" aria-label="Main navigation" th:fragment="navbar">
    <a class="menu-item" th:href="@{/}">Home</a>
    <a class="menu-item" th:href="@{/}">Reviews</a>
    <a class="menu-item" th:href="@{/consultants}">Consultants</a>
    <a class="menu-item" th:href="@{/salespeople}">Sales people</a>
    <a class="menu-item" th:href="@{/}">Companies</a>

</nav>
</body>
</html>
