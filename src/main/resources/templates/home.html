<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Consultant</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 1.5rem; background-color: #f4f4f9; }
        form { display: grid; gap: 0.75rem; max-width: 24rem; }
        label { font-weight: bold; }
        input, button { font: inherit; padding: 0.5rem; }
    </style>
</head>
<body>
<h1>Add Consultant</h1>
<form th:action="@{/}" method="post">
    <div>
        <label for="firstName">First name</label>
        <input id="firstName" name="firstName" type="text" required>
    </div>
    <div>
        <label for="lastName">Last name</label>
        <input id="lastName" name="lastName" type="text" required>
    </div>
    <button type="submit">Add consultant</button>
</form>
</body>
</html>
