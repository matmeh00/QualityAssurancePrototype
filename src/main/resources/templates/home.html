<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Simple Thymeleaf Site</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        h1 { color: #333; }
        p { color: #666; }
    </style>
</head>
<body>

<!-- Dynamically displaying a variable from the controller -->
<h1 th:text="${welcomeMessage}">Welcome Heading</h1>

<!-- Dynamically displaying employee's full name -->
<h1 th:text="${firstName} + ' ' + ${lastName}">Employee Name</h1>


<h1 th:text="${name}">Employee Name</h1>


<p>This page is powered by Spring Boot and Thymeleaf!</p>

</body>
</html>
