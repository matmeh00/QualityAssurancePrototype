<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kvalitéts uppföljning</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f4f9;
            color: #333;
        }

        main {
            padding: 3rem 1.5rem;
            text-align: center;
        }

        .add-review {
            display: inline-block;
            padding: 0.75rem 1rem;
            border-radius: 0.25rem;
            background: #2f3b52;
            color: #fff;
            text-decoration: none;
        }

        .add-review:hover,
        .add-review:focus-visible {
            background: #465a7b;
        }
    </style>
    <style th:replace="~{fragments/navbar :: navbar-styles}"></style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>
    <h1>Kvalitétsuppföljningar</h1>
    <p>Välkommen till Mathias uppföljningsportal!</p>
    <p>Här kan du hantera konsultrecensioner</p>
    <a class="add-review" th:href="@{/followUps}">Skapa en ny uppföljning</a>
</main>
</body>
</html>
