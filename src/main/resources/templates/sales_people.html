<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Säljare</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
        }

        main {
            padding: 1.5rem;
        }

        h1 {
            margin-bottom: 0.5rem;
        }

        .salesperson {
            margin-bottom: 1.25rem;
        }

        .empty {
            color: #666;
        }

        form {
            display: grid;
            gap: 0.75rem;
            max-width: 24rem;
        }

        label {
            font-weight: bold;
        }

        input,
        button {
            font: inherit;
            padding: 0.5rem;
        }
    </style>
    <style th:replace="~{fragments/navbar :: navbar-styles}"></style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>
    <h1>Säljare</h1>

    <div th:if="${salespeople == null or #lists.isEmpty(salespeople)}">
        <p class="empty">Inga säljare tillgängliga</p>
    </div>

    <div th:if="${salespeople != null and !#lists.isEmpty(salespeople)}">
        <ul>
            <li th:each="salesperson : ${salespeople}" class="salesperson">
                <h2 th:text="${salesperson.firstName + ' ' + salesperson.lastName}">
                    Säljarens namn
                </h2>
            </li>
        </ul>
    </div>

    <h2>Skapa en säljare</h2>
    <form th:action="@{/salespeople}" method="post">
        <div>
            <label for="firstName">Förnamn</label>
            <input id="firstName" name="firstName" type="text" required>
        </div>
        <div>
            <label for="lastName">Efternamn</label>
            <input id="lastName" name="lastName" type="text" required>
        </div>
        <button type="submit">Lägg till säljare</button>
    </form>
</main>
</body>
</html>
